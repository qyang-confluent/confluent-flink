# Ubuntu /var/log/syslog + auth.log -> Confluent Cloud Kafka topic (plain JSON, no Schema Registry).
# Install:  sudo cp syslog-to-confluent.conf /etc/logstash/conf.d/
# Secrets:  referenced as ${VAR}; set them in /etc/default/logstash (see logstash.env.example), never inline.

input {
  file {
    path => ["/var/log/syslog", "/var/log/auth.log"]    # auth.log: sshd/sudo/su; syslog: cron, systemd, kernel
    start_position => "end"                             # "beginning" only for a one-off backfill
    sincedb_path => "/var/lib/logstash/sincedb-syslog"
    ecs_compatibility => disabled                       # keep `host` a plain string, not an ECS object
    mode => "tail"
  }
}

filter {
  # Output contract (matches terraform/flink_syslog.sql.tpl): one raw line per event, with the host name.
  # With ecs_compatibility disabled the file input already sets `host` (hostname string) and `path`.
  mutate {
    rename => { "path" => "source_file" }
  }
  # Ubuntu 22.04+ rsyslog writes ISO8601 timestamps: pull the event time out of the line, fall back to ingest time.
  grok {
    match => { "message" => "^%{TIMESTAMP_ISO8601:log_ts} %{HOSTNAME:syslog_host} %{GREEDYDATA:body}$" }
    tag_on_failure => []
  }
  if [log_ts] {
    date { match => ["log_ts", "ISO8601"] target => "@timestamp" }
  }
  # `message` stays the full raw line (the SLM reads the original text). Keep only what the topic needs.
  prune {
    whitelist_names => ["^message$", "^host$", "^source_file$", "^@timestamp$"]
  }
}

output {
  kafka {
    bootstrap_servers => "${CCLOUD_BOOTSTRAP_SERVERS}"
    topic_id          => "syslog"
    message_key       => "%{host}"                      # same host -> same partition, keeps per-host order
    codec             => json
    security_protocol => "SASL_SSL"
    sasl_mechanism    => "PLAIN"
    sasl_jaas_config  => "${CCLOUD_SASL_JAAS_CONFIG}"      # full PlainLoginModule string, as in ~/vault/ccloud/dsp-sandbox.env
    compression_type  => "snappy"
    linger_ms         => 200                            # small batching; fine for a demo
    acks              => "all"
    client_dns_lookup => "use_all_dns_ips"
  }
  # Debug: uncomment to see events locally.
  # stdout { codec => rubydebug }
}
